services:
  postgres:
    image: postgres:16-alpine
    container_name: caseforge-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: caseforge
      POSTGRES_PASSWORD: caseforge
      POSTGRES_DB: caseforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caseforge -d caseforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caseforge-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://caseforge:caseforge@postgres:5432/caseforge
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      NEXTAUTH_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full

volumes:
  postgres_data:
